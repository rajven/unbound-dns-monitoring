server:
        # Hardening mechanisms
        harden-glue: yes
        harden-below-nxdomain: yes

        use-caps-for-id: no

        #DoDOS protection
        #ratelimit: 500
        #ratelimit-slabs: 8
        #ratelimit-factor: 50

        # limits the number of unwanted records in a DNS answer
        unwanted-reply-threshold: 10000
