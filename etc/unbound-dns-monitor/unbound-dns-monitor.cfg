# ============================================
# Common Configuration for DNS/IPSet Monitoring
# ============================================

# -------------------- IPSet Names --------------------

# ipset sets used for routing
# RU segment only
RU_IPSET="RU_IPS"
# used for direct routing of non-RU sites
DIRECT_IPSET="direct"

# flag for forced VPN routing. Needed when routes must be created in the main routing table
CREATE_VPN_ROUTES="no"

# Add-mode for the VPN routing ipset (ROUTE_VPN_IPSETS, e.g. route_vpn):
#   NET24 - add the /24 network calculated from the IP address (default behaviour)
#   IP    - add the address as is (one entry per host)
# The selected mode is also used for system routes when CREATE_VPN_ROUTES="yes"
ROUTE_VPN_ADD_MODE="NET24"

# personal exception from VPN routing for YouTube networks
ROUTE_YOUTUBE_IPSET="route_youtube"
# Add-mode for the YouTube bypass ipset (ROUTE_YOUTUBE_IPSET):
#   NET24 - add the /24 network calculated from the IP address (default behaviour)
#   IP    - add the address as is (one entry per host)
ROUTE_YOUTUBE_ADD_MODE="NET24"
# whether YouTube goes out directly or through the VPN
YOUTUBE_DIRECT="yes"

# -------------------- Network Settings --------------------

# DNS server behind the VPN uplink. Mandatory!
declare -gA VPN_DNS_UPLINKS=(
    [wg0]="1.1.1.1"
)

declare -gA ROUTE_TABLES=(
    [wg0]="vpn1"
)

declare -gA ROUTE_VPN_IPSETS=(
    [wg0]="route_vpn"
)

declare -gA VPN_NAMES=(
    [vpn]="wg0"
)

# DNS server handed to the VPN clients of THIS server
VPN_DNS="10.1.2.1"

# server used for local resolution by the unbound-dns-monitor daemon
DNS_RESOLVER="127.0.0.1"

# -------------------- File Paths --------------------

IPSET_CONF_DIR="/etc/ipset.d"
WEB_OUTPUT_DIR="/var/www/html/ipsets"
IPSET_HOOK="/usr/local/bin/ipset-hook.sh"
IPSET_HOOK_ENABLED="yes"

# -------------------- URLs for Downloads --------------------

IPDENY_URL="https://www.ipdeny.com/ipblocks/data/countries/ru.zone"
GEOLITE_URL="https://cdn.jsdelivr.net/npm/@ip-location-db/geolite2-country/geolite2-country-ipv4.csv"

