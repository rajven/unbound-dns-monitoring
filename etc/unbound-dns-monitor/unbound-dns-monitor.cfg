# ============================================
# Common Configuration for DNS/IPSet Monitoring
# ============================================

# -------------------- IPSet Names --------------------

RU_IPSET="RU_IPS"
DIRECT_IPSET="direct"
VPN_IPSET="vpn"
ROUTE_VPN_IPSET="route_vpn"
ROUTE_YOUTUBE_IPSET="route_youtube"
YOUTUBE_DIRECT="yes"

# -------------------- Network Settings --------------------

VPN_GATEWAY="192.168.1.1"
VPN_DNS_UPLINK="10.1.1.1"
VPN_DNS="10.1.2.1"
VPN_DEV="wg0"
DNS_RESOLVER="127.0.0.1"

# -------------------- File Paths --------------------

IPSET_CONF_DIR="/etc/ipset.d"
WEB_OUTPUT_DIR="/var/www/html/ipsets"
IPSET_HOOK="/usr/local/bin/ipset-hook.sh"
IPSET_HOOK_ENABLED="yes"

# -------------------- URLs for Downloads --------------------

IPDENY_URL="https://www.ipdeny.com/ipblocks/data/countries/ru.zone"
GEOLITE_URL="https://cdn.jsdelivr.net/npm/@ip-location-db/geolite2-country/geolite2-country-ipv4.csv"

# -------------------- Domains to Monitor --------------------

DETECT_IP_DOMAINS=(
    "api.oneme.ru"
    "oneme.ru"
    "checkip.amazonaws.com"
    "api.ipify.org"
    "ifconfig.me"
    "ipv4-internet.yandex.net"
    "ip.mail.ru"
    "ipinfo.io"
    "icanhazip.com"
    "ident.me"
    "myip.dnsomatic.com"
    "bot.whatismyipaddress.com"
    "myip.ru"
    "ifconfig.co"
    "ip.seeip.org"
    "wtfismyip.com"
    "ipecho.net"
    "myexternalip.com"
    "l2.io"
    "eth0.me"
    "ipaddr.site"
    "api64.ipify.org"
    "v4.ident.me"
    "ipv4.icanhazip.com"
    "cloudflare.com"
    "one.one.one.one"
    "ip.tyk.nu"
    "wgetip.com"
    "showmyip.com"
    "ipof.in"
    "whatismyip.akamai.com"
)

# -------------------- Logging Settings --------------------

LOG_TAG_PREFIX="dns-monitor"
LOG_LEVEL="INFO"  # DEBUG, INFO, WARN, ERROR

# -------------------- Script Settings --------------------

ENABLE_IPDENY="yes"
ENABLE_GEOLITE="yes"
ENABLE_WEB_EXPORT="no"
ENABLE_BYPASS_VPN="yes"

# -------------------- Advanced Settings --------------------

IPSET_HASHSIZE="1024"
IPSET_MAXELEM="2655360"
TEMP_DIR="/tmp/dns-monitor"

# Define commands
IP_CMD="/sbin/ip"
IPSET_CMD="/sbin/ipset"
AWK_CMD="/usr/bin/awk"
DIG_CMD="/usr/bin/dig"
