# -------------------- Logging Settings --------------------

LOG_TAG_PREFIX="dns-monitor"
# DEBUG, INFO, WARN, ERROR
LOG_LEVEL="INFO"

# -------------------- Script Settings --------------------

ENABLE_IPDENY="yes"
ENABLE_GEOLITE="yes"

# --------------------  Web Export Settings --------------------

# Enable exporting ipsets to the web
ENABLE_WEB_EXPORT="no"
# Enable exporting ipsets in MikroTik address-list format (.rsc files)
ENABLE_WEB_MIKROTIK_EXPORT="no"
# Enable exporting ipsets in .txt format
ENABLE_WEB_TXT_EXPORT="no"
# Enable exporting the RU zone
ENABLE_WEB_RU_IPSET_EXPORT="no"

# -------------------- Advanced Settings --------------------

IPSET_HASHSIZE="1024"
IPSET_MAXELEM="2655360"
TEMP_DIR="/tmp/dns-monitor"

#1 - enabled, 0 - disabled
IPSET_EXCEPTIONS=(
    "127.0.0.0/8=1"
    "192.168.0.0/16=1"
    "10.0.0.0/8=1"
    "172.16.0.0/12=1"
    "100.64.0.0/10=1"
    "169.254.0.0/16=1"
    "224.0.0.0/4=1"
)

UNBOUND_IPSETS=(
    "direct=hash:ip"
    "telegram=hash:ip"
    "whatsapp=hash:ip"
    "youtube=hash:ip"
    "instagram=hash:ip"
    "facebook=hash:ip"
    "discord=hash:ip"
    "vpn=hash:ip"
)

# -------------------- Commands paths --------------------

# Define commands
IP_CMD="/sbin/ip"
IPSET_CMD="/sbin/ipset"
AWK_CMD="/usr/bin/awk"
DIG_CMD="/usr/bin/dig"
WGET_CMD="/usr/bin/wget"
WGET_OPTS=(
    --no-check-certificate
    --tries=2
    -4
    --dns-timeout=5
    --connect-timeout=15
    --read-timeout=15
    --timeout=15
    --user-agent="Mozilla/5.0 (compatible; DNS-Monitor/1.0)"
)

