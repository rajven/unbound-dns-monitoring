server:
        # raise the number of slabs (for multithreading) = num-threads
        msg-cache-slabs: 1
        rrset-cache-slabs: 1
        infra-cache-slabs: 1
        key-cache-slabs: 1

        # Enable serving expired records
        serve-expired: yes

        # Maximum time expired records may be served for (4 hours)
        serve-expired-ttl: 14400

        # Block query types that load the server
        # Reduces information leakage
        qname-minimisation: yes
        minimal-responses: yes
        # Round-robin record ordering
        rrset-roundrobin: yes

        # Threads
        msg-cache-size: 50m
        rrset-cache-size: 100m
        # Server metadata cache
        infra-cache-numhosts: 20000

        # TTL settings
        # Minimum caching time (60 sec)
        cache-min-ttl: 300
        # Maximum caching time (1 hour, for stable records)
        cache-max-ttl: 720
        # Maximum caching time for negative answers (NXDOMAIN)
        cache-max-negative-ttl: 300
        # TTL for infrastructure records (5 min)
        infra-host-ttl: 300
        # TTL for lame servers (2 min)
        infra-lame-ttl: 120

        # Memory optimization
        # Prefetch popular records
        prefetch: yes

        # Block ANY queries (RFC 8482)
        deny-any: yes
